<div class="exercise-solution">
  <p>Substituindo cada símbolo pela letra que aparece no topo de sua coluna, obtemos, sem espaços:</p>
  <p class="solution-result"><span lang="en">IFMUSICBETHEFOODOFLOVEPLAYON</span></p>
  <p>Com a separação das palavras, a mensagem é:</p>
  <blockquote lang="en">If music be the food of love, play on.</blockquote>
  <p class="solution-note">A frase abre <em>Twelfth Night</em>, de William Shakespeare.</p>
</div>
